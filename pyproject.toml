[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-ta"
version = "0.1.0"
description = "LLM-assisted Thematic Analysis Tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "jinja2>=3.0.0",
    "openai>=1.0.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
llm-ta = "llm_ta.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
